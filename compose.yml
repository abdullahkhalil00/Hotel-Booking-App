services:

  backend:
    build: ./server

    container_name: hotel-backend

    ports:
      - "8000:8000"

    env_file:
      - ./server/.env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - hotel-network


  frontend:
    build:
      context: ./client
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_CURRENCY: ${VITE_CURRENCY}
    
    container_name: hotel-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - hotel-network


networks:

  hotel-network:
    driver: bridge